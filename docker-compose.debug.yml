---
services:
  db:
    image: postgres:18.6-alpine
    container_name: db
    volumes:
      - postgres18_data:/var/lib/postgresql
    env_file:
      - ./.env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  django:
    build: ./django-hallow-ethical-hacking
    container_name: django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - django_static:/app/static
    env_file:
      - ./django-hallow-ethical-hacking/.env
    environment:
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - 5678:5678
    networks:
      - internal

  celery:
    build: ./django-hallow-ethical-hacking
    container_name: celery
    command: celery -A DjangoHallowEthicalHacking worker -l info -c 2
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  celery-beat:
    build: ./django-hallow-ethical-hacking
    container_name: celery-beat
    command: celery -A DjangoHallowEthicalHacking beat -l info
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  redis:
    image: redis:8.8.4-alpine
    container_name: redis
    networks:
      - internal

  vue:
    build:
      context: ./vue-hallow-ethical-hacking
      dockerfile: ./Dockerfile
    container_name: vue
    environment:
      VITE_API_HOST: 127.0.0.1
      VITE_API_PROTO: http
    command: yarn dev
    develop:
      watch:
        - action: rebuild
          path: ./vue-hallow-ethical-hacking/package.json
          target: /app/package.json
        - action: sync
          path: ./vue-hallow-ethical-hacking
          target: /app
          ignore:
            - node_modules
        - action: sync+restart
          path: ./vue-hallow-ethical-hacking/vite.config.ts
          target: /app/vite.config.ts
    depends_on:
      - django
    ports:
      - 5173:5173
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    container_name: nginx
    environment:
      DOMAIN: ${DOMAIN:-127.0.0.1}
    volumes:
      - django_static:/usr/share/nginx/html/static
    restart: unless-stopped
    depends_on:
      - django
      - vue
    ports:
      - 80:80
    networks:
      - internal
      - proxy

volumes:
  postgres18_data:
  django_static:

networks:
  internal:
  proxy:
    external: true
