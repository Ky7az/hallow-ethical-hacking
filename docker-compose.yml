---
services:
  traefik:
    image: traefik:v3.7.18
    container_name: traefik
    restart: unless-stopped
    command:
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --providers.docker=true
      - --providers.docker.network=proxy
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    labels:
      - traefik.http.routers.to-https.rule=HostRegexp(`.+`)
      - traefik.http.routers.to-https.entrypoints=http
      - traefik.http.routers.to-https.middlewares=to-https
      - traefik.http.middlewares.to-https.redirectscheme.scheme=https
    ports:
      - 80:80
      - 443:443
    volumes:
      - letsencrypt_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  db:
    image: postgres:18.6-alpine
    container_name: db
    volumes:
      - postgres18_data:/var/lib/postgresql
    env_file:
      - ./.env
    ports:
      - 5432:5432
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - internal

  django:
    build: ./django-hallow-ethical-hacking
    container_name: django
    command: gunicorn --bind :8000 --workers 3 DjangoHallowEthicalHacking.wsgi
    volumes:
      - django_static:/app/static
    env_file:
      - ./django-hallow-ethical-hacking/.env
    environment:
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - traefik.enable=false
    networks:
      - internal

  celery:
    build: ./django-hallow-ethical-hacking
    container_name: celery
    command: celery -A DjangoHallowEthicalHacking worker -l info
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_started
    labels:
      - traefik.enable=false
    networks:
      - internal

  celery-beat:
    build: ./django-hallow-ethical-hacking
    container_name: celery-beat
    command: celery -A DjangoHallowEthicalHacking beat -l info
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_started
    labels:
      - traefik.enable=false
    networks:
      - internal

  redis:
    image: redis:8.8.4-alpine
    container_name: redis
    labels:
      - traefik.enable=false
    networks:
      - internal

  vue:
    build:
      context: ./vue-hallow-ethical-hacking
      dockerfile: ./Dockerfile
    container_name: vue
    volumes:
      - vue_dst:/app/dist
    depends_on:
      - django
    labels:
      - traefik.enable=false
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    container_name: nginx
    volumes:
      - django_static:/usr/share/nginx/html/static
      - vue_dst:/usr/share/nginx/html
    restart: unless-stopped
    depends_on:
      - django
      - vue
    labels:
      - traefik.enable=true
      - traefik.http.routers.nginx.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.nginx.entrypoints=https
      - traefik.http.routers.nginx.tls=true
      - traefik.http.routers.nginx.tls.certresolver=letsencrypt
      - traefik.http.services.nginx.loadbalancer.server.port=80
      - traefik.docker.network=proxy
    networks:
      - internal
      - proxy

volumes:
  letsencrypt_data:
  postgres18_data:
  django_static:
  vue_dst:

networks:
  internal:
  proxy:
    external: true
